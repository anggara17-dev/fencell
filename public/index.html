<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FENCELL · POS & Pembukuan Toko HP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0058A3; --blue-d:#003E75; --blue-t:#EAF2FA; --blue-l:#A9CBE9;
  --yellow:#FFDB00;
  --ink:#111; --ink2:#4a4a4a; --mut:#8b8b8b;
  --line:#E6E6E3; --bg:#F7F7F5; --bg2:#FAFAF9;
  --ok:#0B7A3B; --ok-t:#E7F5EC;
  --bad:#C02128; --bad-t:#FBEBEB;
  --warn:#8F6400; --warn-t:#FCF3D9;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
svg.ic{flex-shrink:0;vertical-align:-3px}
button{font-family:inherit}
::placeholder{color:#b3b3b0}
#veil{position:fixed;inset:0;background:rgba(255,255,255,.8);display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:12px;font-weight:700;color:var(--ink2)}
#veil.on{display:flex}
.login{display:flex;min-height:100vh}
.lg-left{flex:1.15;background:var(--blue);color:#fff;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between}
.lg-brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.14em;font-size:13px}
.lg-brand .bx{width:34px;height:34px;background:#fff;color:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.lg-mid h1{font-size:clamp(30px,3.4vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1.08;max-width:520px}
.lg-mid p{margin-top:16px;font-size:15.5px;opacity:.85;max-width:440px}
.lg-feats{border-top:1px solid rgba(255,255,255,.28);padding-top:20px;display:flex;flex-direction:column;gap:11px;font-size:13.5px;font-weight:500}
.lg-feats span{display:flex;align-items:center;gap:10px;opacity:.92}
.lg-right{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;padding:40px}
.lg-card{width:100%;max-width:380px}
.lg-card h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.lg-card .sub{color:var(--ink2);margin:6px 0 22px}
.fl{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:14px 0 5px}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-t)}
.err{background:var(--bad-t);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;margin-top:14px}
.demo{margin-top:22px;border:1px dashed var(--line);border-radius:10px;padding:14px}
.demo b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dchip{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.dchip:hover{border-color:var(--blue);color:var(--blue)}
.connset{margin-top:12px;font-size:12.5px}
.connset .csbox{display:none;margin-top:8px;background:var(--bg2);border-radius:10px;padding:12px}
.connset .csbox.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:#c9c9c5;background:var(--bg2)}
.btn.soft{background:var(--blue-t);color:var(--blue)}
.btn.soft:hover{background:#dcebf8}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #efc7c8}
.btn.danger:hover{background:var(--bad-t)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px;gap:6px}
.btn.lg{width:100%;padding:14px;font-size:15px;border-radius:10px}
.btn.blk{background:var(--ink);color:#fff}.btn.blk:hover{background:#000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.side .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.side .brand .bx{width:36px;height:36px;background:var(--blue);color:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center}
.side .brand b{font-size:13px;letter-spacing:.12em;display:block;line-height:1.2}
.side .brand small{color:var(--mut);font-size:11px;font-weight:500}
.snav{flex:1;overflow:auto;padding:6px 0 12px}
.mi{display:flex;align-items:center;gap:11px;padding:10px 16px;margin:1px 10px;border-radius:8px;font-weight:600;color:var(--ink2);cursor:pointer;font-size:13.5px}
.mi:hover{background:var(--bg2);color:var(--ink)}
.mi.on{background:var(--blue-t);color:var(--blue)}
.msub{margin:1px 10px 4px 45px;border-left:2px solid var(--line);padding-left:8px}
.msub div{padding:6px 10px;font-size:12.5px;color:var(--ink2);border-radius:6px;cursor:pointer;font-weight:500}
.msub div:hover{color:var(--ink);background:var(--bg2)}
.msub div.on{color:var(--blue);font-weight:700;background:var(--blue-t)}
.side .ufoot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.ava{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ufoot .un{font-weight:700;font-size:13px;line-height:1.2}
.ufoot .ur{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ufoot .lo{margin-left:auto;cursor:pointer;color:var(--mut);padding:6px;border-radius:7px}
.ufoot .lo:hover{color:var(--bad);background:var(--bad-t)}
.main{margin-left:250px;min-height:100vh;padding-bottom:60px}
.topbar{position:sticky;top:0;z-index:25;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:16px;padding:0 28px}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
.topbar .sp{flex:1}
.clock{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13.5px}
.conn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-weight:700;font-size:12px;cursor:pointer;border:1px solid var(--line);background:#fff}
.conn.on{color:var(--ok)}
.conn.off{color:var(--bad);background:var(--bad-t);border-color:#efc7c8}
.page{max-width:1240px;margin:0 auto;padding:26px 28px}
.hsub{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.lead{color:var(--ink2);margin:2px 0 20px}
.strip{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-wrap:wrap}
.strip>div{flex:1;min-width:200px;padding:18px 22px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.klab{font-size:10.5px;letter-spacing:.09em;color:var(--mut);font-weight:700;text-transform:uppercase}
.kval{font-size:25px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:5px}
.knote{font-size:12px;color:var(--mut);margin-top:3px;font-weight:500}
.knote.good{color:var(--ok);font-weight:700}.knote.badn{color:var(--bad);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h4{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h4 .sp{flex:1}
.dgrid{display:grid;grid-template-columns:1.65fr 1fr;gap:18px;margin-top:18px}
.dgrid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.hrow{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center;padding:6.5px 0;font-size:13px}
.hbar{height:8px;border-radius:4px;background:var(--blue)}
.hbar.lite{background:var(--blue-l)}
.hrow b{font-variant-numeric:tabular-nums;font-weight:700}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.mrow:last-child{border-bottom:0}
.mrow b{font-variant-numeric:tabular-nums}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:13px}
.twrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table.tbl{width:100%;border-collapse:collapse;min-width:660px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg2)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FBFBFA}
.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.bdg.ok{background:var(--ok-t);color:var(--ok)}
.bdg.warn{background:var(--warn-t);color:var(--warn)}
.bdg.bad{background:var(--bad-t);color:var(--bad)}
.bdg.blue{background:var(--blue-t);color:var(--blue)}
.bdg.gray{background:#F0F0EE;color:var(--ink2)}
.bdg.sun{background:var(--yellow);color:#111}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#c6c6c2}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.poswrap{display:flex;gap:20px;align-items:flex-start}
.posleft{flex:1;min-width:0}
.posright{width:400px;flex-shrink:0;position:sticky;top:76px}
.posbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.posbar .srch{position:relative;flex:1;min-width:220px}
.posbar .srch svg{position:absolute;left:12px;top:11px;color:var(--mut)}
.posbar .srch input{padding-left:38px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .12s,transform .12s}
.pcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.09);transform:translateY(-1px)}
.pcard.off{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.pcard.off:hover{transform:none;box-shadow:none}
.pcard .pimg{position:relative;aspect-ratio:1/1;background:#F2F2F0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcard .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .noimg{color:#b3b3b0;font-size:13px;font-weight:600}
.pcard .stoktag{position:absolute;top:8px;right:8px}
.pcard .pbody{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.pcard .pname2{font-weight:700;font-size:13.5px;line-height:1.25}
.pcard .pvar{font-size:11.5px;color:var(--mut);margin-top:2px}
.pcard .pprice{font-weight:800;font-size:14.5px;margin-top:auto;padding-top:8px;font-variant-numeric:tabular-nums}
.scanbtn{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;flex-shrink:0}
.scanbtn:hover{background:#000}
.picklist{display:flex;flex-direction:column;gap:8px}
.pickrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;background:#fff}
.pickrow:hover{border-color:var(--blue);background:var(--blue-t)}
.pickrow b{font-size:13.5px}
.pickrow small{display:block;color:var(--mut);font-size:11.5px}
.pthumb{width:48px;height:48px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--blue-t)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pmeta{font-size:12px;color:var(--mut);margin-top:1px}
.pname{font-weight:700;font-size:13.5px;line-height:1.25}
.cbox{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.chead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chead b{font-size:15px;font-weight:800}
.citem{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--bg2);align-items:flex-start}
.cthumb{width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--blue-t)}
.cthumb img{width:100%;height:100%;object-fit:cover}
.citem .nm{font-weight:600;font-size:13px;line-height:1.3}
.citem .im{font-size:11px;color:var(--mut)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.step button{border:0;background:#fff;width:24px;height:24px;cursor:pointer;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.step button:hover{background:var(--bg2)}
.step span{min-width:26px;text-align:center;font-weight:700;font-size:12.5px}
.cfoot{padding:14px 16px;background:var(--bg2)}
.ctot{display:flex;justify-content:space-between;font-weight:600;padding:2.5px 0;font-size:13px;color:var(--ink2)}
.ctot.grand{color:var(--ink);font-size:15px;padding-top:8px;margin-top:6px;border-top:1px solid var(--line)}
.ctot.grand b{font-size:23px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.miniact{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.tagline{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px dashed #d5d5d1;border-radius:9px;padding:8px 11px;margin:6px 0;font-size:12.5px}
.mback{position:fixed;inset:0;background:rgba(15,15,15,.46);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;animation:pop .18s}
.modal.wide{max-width:860px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.mhead h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
.mhead .x{cursor:pointer;color:var(--mut);padding:6px;border-radius:7px}
.mhead .x:hover{background:var(--bg2);color:var(--ink)}
.mbody{padding:16px 24px 24px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:0 24px 22px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
@keyframes fade{from{opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.coRemain{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.payrow{display:grid;grid-template-columns:1fr 120px auto auto;gap:8px;align-items:center;margin-bottom:8px}
.notecicil{background:var(--warn-t);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:12.5px;color:var(--ink2)}
.hint{color:var(--bad);font-weight:600;font-size:12.5px;margin-top:8px;min-height:16px}
.imgprev{width:76px;height:76px;border:1.5px dashed #c9c9c5;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:var(--bg2);flex-shrink:0}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgprev:hover{border-color:var(--blue)}
.num-inp{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.hpprow{display:grid;grid-template-columns:1fr 120px 170px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bg2)}
tr.vrow td{background:var(--bg2);padding:8px 14px 8px 42px;font-size:12.5px}
tr.vrow:hover td{background:#F3F3F1}
#toastRoot{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:10px}
.toast{background:#151515;color:#fff;padding:12px 16px;border-radius:11px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:13.5px;box-shadow:0 10px 34px rgba(0,0,0,.22);animation:tin .22s;max-width:380px}
.toast .tic{color:#57CE8E}.toast.err .tic{color:#FF9089}
@keyframes tin{from{transform:translateX(24px);opacity:0}}
.rcpt{background:#fff;font-family:'Courier New',ui-monospace,monospace;font-size:12px;line-height:1.5;color:#111;padding:18px 14px;margin:0 auto;width:300px;border:1px solid var(--line);border-radius:4px}
.rcpt.w80{width:390px}
.rcpt .c{text-align:center}.rcpt .b{font-weight:700}
.rcpt hr{border:0;border-top:1px dashed #9a9a9a;margin:7px 0}
.rcpt table{width:100%;border-collapse:collapse;font-size:12px}
.rcpt td{padding:1px 0;vertical-align:top}
.rcpt .r{text-align:right;white-space:nowrap}
.paperwrap{background:var(--bg2);border-radius:12px;padding:22px;display:flex;justify-content:center}
.spin{width:16px;height:16px;border:2.5px solid var(--blue-t);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.big{width:34px;height:34px;border-width:4px}
@keyframes sp{to{transform:rotate(360deg)}}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .rcpt{border:0;border-radius:0;width:58mm!important;box-shadow:none;padding:4mm}
  #printArea .rcpt.w80{width:80mm!important}
}
@media (max-width:1080px){
  .poswrap{flex-direction:column}
  .posright{width:100%;position:static}
  .dgrid,.dgrid2{grid-template-columns:1fr}
}
@media (max-width:860px){
  .side{width:64px}
  .side .brand b,.side .brand small,.mi span,.msub,.ufoot .un,.ufoot .ur{display:none}
  .mi{justify-content:center;padding:12px 0}
  .main{margin-left:64px}
  .lg-left{display:none}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="printArea"></div>
<div id="veil"><span class="spin big"></span><span id="veilTxt">Memuat data…</span></div>

<!-- env.js di-inject server.js dari environment Render -->
<script src="env.js"></script>
<!-- Supabase JS (UMD) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

/* ---------------- Outbox (offline queue) ---------------- */
const OBK='fencell_outbox';
const outbox=()=>{try{return JSON.parse(localStorage.getItem(OBK)||'[]')}catch(e){return[]}};
const saveOutbox=q=>localStorage.setItem(OBK,JSON.stringify(q));
async function flushOutbox(){
  const q=outbox();if(!q.length||!navigator.onLine)return q.length;
  const remain=[];
  for(const job of q){
    try{
      const{error}=await sb.rpc('create_transaction',job.payload);
      if(error)throw error;
    }catch(e){
      if(!/fetch|network/i.test(e.message||'')){ // error permanen → buang + beri tahu
        toast('Satu transaksi offline gagal divalidasi: '+(e.message||e),'err');
        continue;
      }
      remain.push(job); // masih offline → antre lagi
    }
  }
  saveOutbox(remain);
  if(q.length&&!remain.length){toast(q.length+' transaksi offline berhasil tersinkron');reloadTransactions().catch(()=>{});}
  setConn();
  return remain.length;
}
window.addEventListener('online',()=>{setConn();flushOutbox()});
window.addEventListener('offline',setConn);

let _rtT=null;
function scheduleSync(kind){
  clearTimeout(_rtT);
  _rtT=setTimeout(async()=>{
    try{
      if(kind==='tx')await reloadTransactions();
      else{await Promise.all([loadProducts(),loadMethods()])}
      setConn();
      if(!$('#modalRoot').innerHTML){route()}
      toast('Data tersinkron dari perangkat lain');
    }catch(e){/* senyap */}
  },600);
}
function startRealtime(){
  if(CHANNEL||!sb)return;
  CHANNEL=sb.channel('fencell-sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>scheduleSync('prod'))
    .on('postgres_changes',{event:'*',schema:'public',table:'product_variants'},()=>scheduleSync('prod'))
    .on('postgres_changes',{event:'*',schema:'public',table:'transactions'},()=>scheduleSync('tx'))
    .on('postgres_changes',{event:'*',schema:'public',table:'payment_methods'},()=>scheduleSync('prod'))
    .subscribe();
}
function stopRealtime(){if(CHANNEL){sb.removeChannel(CHANNEL);CHANNEL=null}}

async function loadProducts(){
  if(!canStok()){
    const{data,error}=await sb.from('v_products_pos').select('*').order('name');
    if(error)throw error;
    const by={};
    (data||[]).forEach(r=>{
      const p=by[r.id]||(by[r.id]={id:r.id,name:r.name,cat:r.category,img:r.img_url,active:r.active,created:0,variants:[]});
      p.variants.push({id:r.variant_id,storage:r.storage||'',color:r.color||'',imei:r.imei||'',cond:r.cond||'',price:+r.price,cost:null,warranty:r.warranty_m,qty:r.qty,source:r.source,consignment:r.consignment,active:r.v_active});
    });
    db.products=Object.values(by);
  }else{
    const[p1,p2]=await Promise.all([
      sb.from('products').select('id,name,category,img_url,active,created_at').order('name'),
      sb.from('product_variants').select('id,product_id,storage,color,imei,cond,price,cost,warranty_m,qty,source,consignment,active')
    ]);
    if(p1.error)throw p1.error; if(p2.error)throw p2.error;
    const by={};
    p1.data.forEach(p=>by[p.id]={id:p.id,name:p.name,cat:p.category,img:p.img_url,active:p.active,created:p.created_at,variants:[]});
    p2.data.forEach(v=>{const p=by[v.product_id];if(!p)return;
      p.variants.push({id:v.id,storage:v.storage||'',color:v.color||'',imei:v.imei||'',cond:v.cond||'Baru',price:+v.price,cost:+v.cost,warranty:v.warranty_m,qty:v.qty,source:v.source,consignment:v.consignment,active:v.active})});
    db.products=Object.values(by);
  }
}

      .map(v=>({p,v,expect:sum[v.id]||0})));

let _dashCache=null,_dashAt=0;
async function dashData(){
  if(_dashCache&&Date.now()-_dashAt<60000)return _dashCache;
  const t0=startDay(Date.now()),tn=endDay(Date.now());
  const mStart=new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime();
  const[r1,r2]=await Promise.all([
    sb.rpc('pnl_report',{f:dISO(t0),t:dISO(tn)}),
    sb.rpc('pnl_report',{f:dISO(mStart),t:dISO(tn)})
  ]);
  if(r1.error)throw r1.error;if(r2.error)throw r2.error;
  const day={rev:+r1.data.rev||0,hpp:+r1.data.hpp||0,fee:+r1.data.fee||0,exp:+r1.data.exp||0,cnt:r1.data.cnt||0};
  const mon={rev:+r2.data.rev||0};
  day.gross=day.rev-day.hpp;day.net=day.rev-day.hpp-day.fee-day.exp;
  const[pay,txs]=await Promise.all([
    sb.from('payments').select('amount,fee,paid_at,method_id,payment_methods(type,name)').gte('paid_at',iso(mStart)),
    sb.from('transactions').select('id,no,buyer,created_at,status').gte('created_at',iso(mStart)).neq('status','void').limit(300)
  ]);
  const payM=(pay.data||[]).filter(p=>p.payment_methods&&p.payment_methods.type==='paylater');
  const byTx={};payM.forEach(p=>{byTx[p.tx_id]=byTx[p.tx_id]||{sum:0,fee:0,name:p.payment_methods.name};byTx[p.tx_id].sum+=+p.amount;byTx[p.tx_id].fee+=+p.fee});
  const txMap={};(txs.data||[]).forEach(t=>txMap[t.id]=t);
  const payList=Object.entries(byTx).map(([id,v])=>({tx:txMap[id]||{no:'—',buyer:''},...v}))
    .sort((a,b)=>(b.tx.created_at||'').localeCompare(a.tx.created_at||''));
  const f30=startDay(Date.now()-29*864e5);
  const{data:tx30}=await sb.from('transactions').select('id,total,status,created_at').gte('created_at',iso(f30)).neq('status','void').limit(500);
  const ids=(tx30||[]).map(t=>t.id);
  let top=[];
  if(ids.length){
    const{data:items}=await sb.from('transaction_items').select('name,qty,price,tx_id').in('tx_id',ids);
    const agg={};(items||[]).forEach(i=>{agg[i.name]=agg[i.name]||{name:i.name,qty:0,rev:0};agg[i.name].qty+=i.qty;agg[i.name].rev+=i.price*i.qty});
    top=Object.values(agg).sort((a,b)=>b.qty-a.qty).slice(0,5);
  }
  const trend=[];
  for(let i=13;i>=0;i--){
    const f=startDay(Date.now()-i*864e5);
    const{data:tr}=await sb.rpc('pnl_report',{f:dISO(f),t:dISO(f)});
    trend.push({label:dShort(f),full:dFull(f),rev:+(tr?.rev||0),profit:+(tr?.rev||0)-(tr?.hpp||0)});
  }
  let audit=[];
  try{audit=await stockAudit()}catch(e){}
  _dashCache={day,mon,payList,paySum:payList.reduce((a,x)=>a+x.sum,0),payFee:payList.reduce((a,x)=>a+x.fee,0),top,trend,audit};
  _dashAt=Date.now();
  return _dashCache;
}

      </div>
      <div class="card"><h4>${ic('alert',15)} Stok Menipis</h4>${lowStock()}</div>
    </div>`;
  }catch(e){$('#view').innerHTML=`<div class="err">Gagal memuat dashboard: ${esc(e.message||e)}</div>`}

function trendSVG(days){
  const W=760,H=225,B=26,T=12,max=Math.max(...days.map(d=>d.rev),1e6),gw=W/days.length,bw=Math.min(13,gw*0.3);
  let s='';
  days.forEach((d,i)=>{const x=i*gw+gw/2;
    const hr=Math.max(2,d.rev/max*(H-T-B)),hp=Math.max(2,d.profit/max*(H-T-B));
    s+=`<rect x="${(x-bw-1.5).toFixed(1)}" y="${(H-B-hr).toFixed(1)}" width="${bw}" height="${hr.toFixed(1)}" rx="2.5" fill="#0058A3"><title>${d.full} — Penjualan: ${fmt(d.rev)}</title></rect>`;
    s+=`<rect x="${(x+1.5).toFixed(1)}" y="${(H-B-hp).toFixed(1)}" width="${bw}" height="${hp.toFixed(1)}" rx="2.5" fill="#A9CBE9"><title>${d.full} — Laba kotor: ${fmt(d.profit)}</title></rect>`;
    if(i%2===0)s+=`<text x="${x}" y="${H-8}" font-size="10.5" fill="#9a9a97" text-anchor="middle" font-family="Inter,sans-serif">${d.label}</text>`;
  });
  s+=`<line x1="0" y1="${H-B}" x2="${W}" y2="${H-B}" stroke="#E6E6E3"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
}
function lowStock(){
  const low=db.products.filter(p=>p.active&&p.cat==='aksesoris')
    .flatMap(p=>p.variants.filter(v=>v.active!==false&&v.qty<=10).map(v=>({p,v})))
    .sort((a,b)=>a.v.qty-b.v.qty);
  if(!low.length)return '<div class="empty">Semua stok aksesoris aman.</div>';
  return low.map(x=>`<div class="mrow"><span>${esc(x.p.name)}</span><span class="bdg ${x.v.qty<=5?'bad':'warn'}">sisa ${x.v.qty}</span></div>`).join('')
    +`<div class="mrow"><span>Unit HP & tablet tersedia</span><b>${db.products.filter(p=>p.active&&p.cat!=='aksesoris').reduce((a,p)=>a+pAvail(p).length,0)} unit</b></div>`;
}

function prodListHTML(){

function openPick(pid){
  const p=db.products.find(x=>x.id===pid);

  if(!avail.length)return toast('Stok habis','err');
  if(avail.length===1)return addToCartV(pid,avail[0].id);
  openModal(`${mhead('Pilih Storage — '+esc(p.name))}
  <div class="mbody"><div class="picklist">
    ${p.variants.filter(v=>v.active!==false).map(v=>{

function addToCartV(pid,vid){
  const p=db.products.find(x=>x.id===pid);
  const v=p&&p.variants.find(z=>z.id===vid);
  if(!v||(v.qty||0)<1)return toast('Stok varian ini habis','err');
  const key=pid+'|'+vid;
  if(p.cat==='aksesoris'){
    const it=S.pos.cart.find(i=>i.pid+'|'+i.vid===key);
    if(it){if(it.qty>=v.qty)return toast('Stok hanya '+v.qty,'err');it.qty++}
    else S.pos.cart.push({pid,vid,name:p.name,vlabel:vLabel(v),qty:1,price:v.price,cost:v.cost,cat:p.cat,imei:'',warranty:v.warranty,img:p.img||null});
  }else{
    if(S.pos.cart.some(i=>i.pid+'|'+i.vid===key))return toast('Unit sudah ada di keranjang');
    S.pos.cart.push({pid,vid,name:p.name,vlabel:vLabel(v),qty:1,price:v.price,cost:v.cost,cat:p.cat,imei:v.imei||'',warranty:v.warranty,img:p.img||null});
  }
  updatePOS();
}
function posScanEnter(){

  for(const p of db.products.filter(x=>x.active)){

      addToCartV(p.id,v.id);S.q.pos='';const el=$('#posQ');if(el)el.value='';renderProdList();return;

}

function discAmt(sub){const d=S.pos.disc;if(!d)return 0;const a=d.type==='percent'?Math.round(sub*d.value/100):d.value;return Math.min(a,sub)}
function updatePOS(){if(S.view!=='pos'||S.sub)return;$('#prodList').innerHTML=prodListHTML();$('#cartBox').innerHTML=cartHTML()}
function chQty(key,d){const it=S.pos.cart.find(i=>i.pid+'|'+i.vid===key);if(!it)return;
  const p=db.products.find(x=>x.id===it.pid);const v=p&&p.variants.find(z=>z.id===it.vid);
  it.qty+=d;if(it.qty<1)return rmCart(key);
  if(v&&it.qty>v.qty){it.qty=v.qty;toast('Stok hanya '+v.qty,'err')}updatePOS()}
function rmCart(key){S.pos.cart=S.pos.cart.filter(i=>i.pid+'|'+i.vid!==key);updatePOS()}
function clearCart(){if(!S.pos.cart.length)return;confirmDlg('Kosongkan keranjang?','Semua item, tukar tambah, dan diskon akan dibuang.',()=>{S.pos={cart:[],trade:[],disc:null,buyer:''};updatePOS()},'Kosongkan')}
function rmTrade(i){S.pos.trade.splice(i,1);updatePOS()}
function rmDisc(){S.pos.disc=null;updatePOS()}

function saveDisc(){

  if(type==='percent'&&val>100)return $('#dErr').textContent='Persen tidak boleh lebih dari 100.';

    $('#d_appr').innerHTML=`<div style="background:var(--warn-t);border-radius:10px;padding:12px 14px;margin-top:14px">

let co=null;
function openCheckout(){
  const act=db.paymentMethods.filter(m=>m.active);
  if(!act.length)return toast('Belum ada metode bayar aktif — atur di Metode Bayar','err');
  const c=S.pos,sub=c.cart.reduce((a,i)=>a+i.price*i.qty,0);
  const total=sub-discAmt(sub)-c.trade.reduce((a,t)=>a+t.value,0);
  co={buyer:c.buyer||'',rows:[{mid:act[0].id,amt:total}]};
  openModal(`${mhead('Pembayaran')}
  <div class="mbody" id="coBody">${coBodyHTML()}</div>`, 'wide');
  coSoft();
}
function coCalc(){
  const c=S.pos,sub=c.cart.reduce((a,i)=>a+i.price*i.qty,0);
  const disc=discAmt(sub),trade=c.trade.reduce((a,t)=>a+t.value,0);
  const total=sub-disc-trade,paid=co.rows.reduce((a,r)=>a+r.amt,0);
  return{sub,disc,trade,total,paid,remain:total-paid};
}
function coBodyHTML(){
  const c=S.pos,cal=coCalc();
  return `
  <div style="background:var(--bg2);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center">
    <div><div class="klab">Total Tagihan</div><div style="font-size:24px;font-weight:800;font-variant-numeric:tabular-nums">${fmt(cal.total)}</div>
    <small style="color:var(--mut)">${c.cart.length} item${c.trade.length?' · '+c.trade.length+' trade-in':''}${cal.disc?' · diskon '+fmt(cal.disc):''}${co.buyer?' · '+esc(co.buyer):''}</small></div>
    <div style="width:230px"><label class="fl" style="margin-top:0">Nama konsumen</label><input class="inp" id="coBuyer" value="${esc(co.buyer)}" oninput="co.buyer=this.value;S.pos.buyer=this.value" placeholder="untuk nota & garansi"></div>
  </div>
  <label class="fl">Pembayaran sekarang (boleh lebih dari satu metode / split)</label>
  <div id="coRows">${coRowsHTML()}</div>
  <button class="btn ghost sm" onclick="coAddRow()">${ic('plus',14)} Tambah metode bayar</button>
  <div class="notecicil">${ic('shield',14)} <b>Cicilan via aplikasi resmi</b> (Kredivo, Akulaku, ShopeePayLater, dll): pilih sebagai salah satu metode — transaksi langsung <b>LUNAS</b> karena dibayar penuh oleh provider. Fee merchant provider otomatis tercatat & mengurangi laba bersih.</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
    <div><div class="klab">Sisa Tagihan</div><div class="coRemain" id="coRemain"></div></div>
    <div style="text-align:right"><div class="klab">Dibayar Sekarang</div><div class="coRemain" id="coPaid" style="font-size:16px"></div></div>
  </div>
  <div class="hint" id="coHint"></div>
  <button class="btn lg" id="coGo" onclick="finalizeSale()" style="margin-top:6px">${ic('check',17)} Selesaikan Transaksi</button>`;
}
function coRowsHTML(){
  const mths=db.paymentMethods.filter(m=>m.active);
  return co.rows.map((r,i)=>`<div class="payrow">
    <select class="inp" onchange="coMtd(${i},this.value)">${mths.map(m=>`<option value="${m.id}" ${r.mid===m.id?'selected':''}>${esc(m.name)}${m.type==='paylater'?' · Cicilan':''}${m.feeType!=='none'?' ('+m.feeValue+(m.feeType==='percent'?'%':' Rp')+')':''}</option>`).join('')}</select>
    <input class="inp" data-money value="${mFmt(r.amt)}" oninput="coAmt(${i},this)">
    <button class="btn soft sm" title="Isi sisa tagihan ke baris ini" onclick="coFillRow(${i})">Sisa</button>
    <button class="btn ghost sm" style="padding:6px;color:var(--mut)" onclick="coRmRow(${i})" ${co.rows.length<2?'disabled':''}>${ic('x',13)}</button>
  </div>`).join('')
  +(S.pos.trade.length?`<div class="payrow"><div class="inp" style="background:var(--bg2);display:flex;align-items:center">${ic('repeat',14)}&nbsp; Tukar Tambah (${S.pos.trade.length} unit)</div><div class="inp" style="background:var(--bg2);font-weight:700">${mFmt(S.pos.trade.reduce((a,t)=>a+t.value,0))}</div><span></span><span></span></div>`:'');
}
function coMtd(i,v){co.rows[i].mid=v;coSoft()}
function coAmt(i,el){co.rows[i].amt=mParse(el.value);coSoft()}
function coAddRow(){const r=coCalc();co.rows.push({mid:db.paymentMethods.find(m=>m.active).id,amt:Math.max(0,r.remain)});$('#coRows').innerHTML=coRowsHTML();coSoft()}
function coRmRow(i){co.rows.splice(i,1);$('#coRows').innerHTML=coRowsHTML();coSoft()}
function coFillRow(i){
  const others=co.rows.reduce((a,r,k)=>k===i?a:a+r.amt,0);
  co.rows[i].amt=Math.max(0,coCalc().total-others);
  $('#coRows').innerHTML=coRowsHTML();coSoft();
}
function coSoft(){
  const cal=coCalc();
  $('#coPaid').textContent=fmt(Math.min(cal.paid,cal.total));
  $('#coRemain').textContent=fmt(Math.max(0,cal.remain));
  $('#coRemain').style.color=cal.remain<=0?'var(--ok)':'var(--ink)';
  const go=$('#coGo'),hint=$('#coHint');let msg='';
  if(cal.remain<0)msg='Total pembayaran melebihi tagihan.';
  else if(cal.remain>0)msg='Lunasi total tagihan — gunakan tombol "Sisa" untuk mengisi otomatis.';
  hint.textContent=msg;go.disabled=!!msg;
}
const guard_=async e=>{throw e};
async function finalizeSale(){
  const cal=coCalc();if(cal.remain!==0)return;
  const c=S.pos;
  const lack=[];
  c.cart.forEach(i=>{const p=db.products.find(x=>x.id===i.pid);
    const v=p&&p.variants.find(z=>z.id===i.vid);
    if(!v||v.qty<i.qty)lack.push(i.name+' '+i.vlabel+(v?` (sisa ${v.qty})`:''))});
  if(lack.length){toast('Stok tidak cukup: '+lack.join(', ')+'. Cek Kartu Stok / lakukan Opname.','err');return}
  const no='INV-'+ymd(Date.now())+'-'+String((db.transactions.filter(t=>t.no.includes('INV-'+ymd(Date.now()))).length||0)+1).padStart(4,'0');
  const txid=uid();
  const payload={
    transaction:{id:txid,no,cashier_name:(PROFILE?.name||S.user.email||''),buyer:co.buyer.trim(),
      subtotal:cal.sub,discount:c.disc?{type:c.disc.type,value:c.disc.value,reason:c.disc.reason||''}:null,
      discount_amt:cal.disc,trade_total:cal.trade,total:cal.total,device:navigator.userAgent.slice(0,60)},
    items:c.cart.map(i=>({product_id:i.pid,variant_id:i.vid,name:i.name,vlabel:i.vlabel,qty:i.qty,price:i.price,
      category:i.cat,imei:i.imei,warranty_m:i.warranty,
      consignment:(()=>{const p=db.products.find(x=>x.id===i.pid);const v=p&&p.variants.find(z=>z.id===i.vid);
        return v&&v.consignment?{owner:v.consignment.owner,pct:v.consignment.pct}:null})()})),
    tradeIns:c.trade.map(t=>({model:t.model,storage:t.storage||'',color:t.color||'',imei:t.imei||'',cond:t.cond,inc:t.inc||'',value:t.value})),
    payments:co.rows.map(r=>({method_id:r.mid,amount:r.amt}))
  };
  const btn=$('#coGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Menyimpan…';
  const tx={id:txid,no,ts:Date.now(),cashier:PROFILE?.name||S.user.email,buyer:co.buyer.trim(),
    items:c.cart.map(i=>({pid:i.pid,vid:i.vid,name:i.name,vlabel:i.vlabel,qty:i.qty,price:i.price,cost:i.cost??null,cat:i.cat,imei:i.imei,warranty:i.warranty,img:i.img||null,
      consign:(()=>{const p=db.products.find(x=>x.id===i.pid);const v=p&&p.variants.find(z=>z.id===i.vid);
        return v&&v.consignment?{owner:v.consignment.owner,pct:v.consignment.pct,amt:v.cost}:null})()})),
    tradeIns:c.trade.map(t=>({...t})),disc:c.disc?{...c.disc,amt:cal.disc}:null,
    subtotal:cal.sub,discAmt:cal.disc,tradeTotal:cal.trade,total:cal.total,
    payments:co.rows.map(r=>{const m=db.paymentMethods.find(x=>x.id===r.mid);
      return{mid:r.mid,name:m?m.name:'—',amt:r.amt,fee:m?feeOf(m,r.amt):0,note:m&&m.type==='paylater'?'Cicilan via aplikasi':''}}),
    status:'lunas'};
  let saved=false;
  if(navigator.onLine){
    const{data,error}=await sb.rpc('create_transaction',payload);
    if(error){
      if(/fetch|network/i.test(error.message||'')){/* jatuh ke offline */}
      else{btn.disabled=false;btn.innerHTML=ic('check',17)+' Selesaikan Transaksi';toast('Gagal: '+(error.message||error),'err');return}
    }else saved=true;
  }
  if(!saved){
    const q=outbox();q.push({payload,ts:Date.now()});saveOutbox(q);setConn();
    tx.offlineFlag=true;
  }
  // efek lokal: kurangi stok varian di mirror
  tx.items.forEach(it=>{const p=db.products.find(x=>x.id===it.pid);const v=p&&p.variants.find(z=>z.id===it.vid);if(v)v.qty=Math.max(0,(v.qty||0)-it.qty)});
  db.transactions.unshift(tx);
  S.pos={cart:[],trade:[],disc:null,buyer:''};closeModal();
  if(S.view==='pos')updatePOS();
  if(saved){toast('Transaksi '+no+' tersimpan · LUNAS');loadProducts().catch(()=>{});_dashCache=null}
  else toast('Disimpan di perangkat (OFFLINE) — otomatis sinkron saat online','err');
  openReceipt(tx.id);
}

function barcodeSVG(txt,h=30){
  let x=0,bars='';const seed=[...txt].map(c=>c.charCodeAt(0));
  seed.concat(seed).forEach((v,i)=>{const w=1+(v+i)%3;bars+=`<rect x="${x}" y="0" width="${w}" height="${h}" fill="#111"/>`;x+=w+1+(v%2)});
  return `<svg width="${x}" height="${h}" viewBox="0 0 ${x} ${h}" style="display:block;margin:6px auto 0">${bars}</svg>`;
}

function imgPick(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/'))return toast('File harus gambar (JPG/PNG)','err');
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const MAX=640;
      let{width:w,height:h}=im;
      if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r)}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      cv.toBlob(b=>{S.imgTmpBlob=b;S.imgTmpUrl=cv.toDataURL('image/jpeg',.8);renderImgPrev();toast('Foto siap disimpan')},'image/jpeg',.82);
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(file);
  input.value='';
}
function imgClear(){S.imgTmpBlob=null;S.imgTmpUrl=null;renderImgPrev()}
async function uploadPhoto(){
  if(!S.imgTmpBlob)return null;

  const{error}=await sb.storage.from('product-images').upload(name,S.imgTmpBlob,{contentType:'image/jpeg',cacheControl:'31536000'});
  if(error)throw error;
  const{data}=sb.storage.from('product-images').getPublicUrl(name);
  return data.publicUrl;
}

const saveVar=guard(async function(pid,vid){
  const p=db.products.find(x=>x.id===pid);if(!p)return;
  const g=id=>$('#'+id);
  const price=mParse(g('v_price').value);
  if(price<=0)return $('#vErr').textContent='Harga jual wajib diisi.';
  const unit=isUnit(p);
  if(unit&&!g('v_storage').value.trim())return $('#vErr').textContent='Storage wajib diisi untuk HP/Tablet.';
  const cons=unit&&g('v_cons')&&g('v_cons').checked;
  if(cons&&!g('v_cowner').value.trim())return $('#vErr').textContent='Nama penitip wajib diisi.';
  if(!needOnline())return;
  veil(true,'Menyimpan…');
  try{
    const row={storage:g('v_storage').value.trim(),color:g('v_color').value.trim(),
      imei:unit?g('v_imei').value.trim():null,cond:g('v_cond').value.trim()||'Baru',
      price,warranty_m:Math.max(0,parseInt(g('v_warranty').value)||0),
      consignment:cons?{owner:g('v_cowner').value.trim(),pct:parseFloat(g('v_cpct').value)||90}:null};
    if(canOwner())row.cost=cons?Math.round(price*(parseFloat(g('v_cpct').value)||90)/100):mParse(g('v_cost').value);
    if(vid){
      const v=p.variants.find(z=>z.id===vid);
      const{error}=await sb.from('product_variants').update(row).eq('id',vid);
      if(error)throw error;
      Object.assign(v,row);toast('Varian diperbarui');
    }else{
      const qty=unit?1:Math.max(1,parseInt(g('v_qty').value)||1);
      row.qty=qty;row.source='buy';row.product_id=pid;
      const{data,error}=await sb.from('product_variants').insert(row).select('id').single();
      if(error)throw error;
      const{error:e2}=await sb.from('moves').insert({product_id:pid,variant_id:data.id,pname:p.name,
        vlabel:vLabel(row),type:'init',delta:qty,before:0,after:qty,ref:{},note:'Tambah varian',by_name:PROFILE?.name||''});
      if(e2)console.warn('move gagal:',e2.message);
      p.variants.push({id:data.id,storage:row.storage,color:row.color,imei:row.imei||'',cond:row.cond,price,cost:row.cost??null,warranty:row.warranty_m,qty,source:'buy',consignment:row.consignment,active:true});
      toast('Varian '+vLabel(row)+' masuk stok (+'+qty+')');
    }
    closeModal();renderMasterT();
  }finally{veil(false)}
});
const softDelProduct=guard(async function(pid){
  const p=db.products.find(x=>x.id===pid);
  confirmDlg(p.active?'Nonaktifkan produk?':'Aktifkan kembali?',p.active?`"${esc(p.name)}" beserta semua variannya disembunyikan dari kasir (soft delete).`:`"${esc(p.name)}" tampil kembali di kasir & stok.`,async()=>{
    try{
      const{error}=await sb.from('products').update({active:!p.active}).eq('id',pid);
      if(error)throw error;
      p.active=!p.active;renderMasterT();
      toast(p.active?'Produk diaktifkan':'Produk dinonaktifkan');
    }catch(e){toast('Gagal: '+(e.message||e),'err')}
  },p.active?'Nonaktifkan':'Aktifkan');
});

const saveBM=guard(async function(){
  const g=id=>$('#'+id);
  const sel=g('bm_pid').value, storage=g('bm_storage').value.trim(), price=mParse(g('bm_price').value);
  const cost=canOwner()?mParse(g('bm_cost').value):Math.round(price*0.87);
  if(!storage)return $('#bmErr').textContent='Storage wajib diisi.';
  if(price<=0)return $('#bmErr').textContent='Harga jual wajib diisi.';
  if(cost<=0)return $('#bmErr').textContent='Harga modal (HPP) wajib diisi.';
  if(!needOnline())return;
  veil(true,'Menyimpan…');
  try{
    let p,kind;
    if(sel==='__new'){
      const nm=g('bm_name').value.trim();
      if(!nm)return $('#bmErr').textContent='Nama seri baru wajib diisi.';
      const{data,error}=await sb.from('products').insert({name:nm,category:g('bm_cat').value}).select('id').single();
      if(error)throw error;
      p={id:data.id,name:nm,cat:g('bm_cat').value,img:null,active:true,variants:[]};
      db.products.push(p);kind='new';
    }else{
      p=db.products.find(x=>x.id===sel);kind='addvar';
    }
    const vrow={product_id:p.id,storage,color:g('bm_color').value.trim(),imei:g('bm_imei').value.trim()||null,
      cond:g('bm_cond').value.trim()||'Baru',price,cost,warranty_m:Math.max(0,parseInt(g('bm_warranty').value)||12),
      qty:1,source:'buy'};
    const{data:v, error:ve}=await sb.from('product_variants').insert(vrow).select('id').single();
    if(ve)throw ve;
    const pno='BM-'+ymd(Date.now())+'-'+String(Date.now()).slice(-5);
    const{data:po,error:pe}=await sb.from('purchases').insert({no:pno,supplier:g('bm_supplier').value.trim()||'Tanpa nota',by_name:PROFILE?.name||''}).select('id').single();
    if(pe)throw pe;
    const{error:le}=await sb.from('purchase_lines').insert({purchase_id:po.id,product_id:p.id,variant_id:v.id,kind,name:p.name+' · '+vLabel(vrow),qty:1,cost});
    if(le)throw le;
    await sb.from('moves').insert({product_id:p.id,variant_id:v.id,pname:p.name,vlabel:vLabel(vrow),type:'in',delta:1,before:0,after:1,ref:{kind:'purchase',id:po.id,no:pno},note:g('bm_supplier').value.trim()||'Tanpa nota',by_name:PROFILE?.name||''});
    p.variants.push({id:v.id,storage:vrow.storage,color:vrow.color,imei:vrow.imei||'',cond:vrow.cond,price,cost,warranty:vrow.warranty_m,qty:1,source:'buy',consignment:null,active:true});
    closeModal();loadPurchases().then(renderMasukT);
    toast('Unit masuk: '+p.name+' '+vLabel(vrow)+' ('+pno+')');
  }finally{veil(false)}
});

const saveRestock=guard(async function(){
  const [pid,vid]=$('#rs_key').value.split('|');
  const p=db.products.find(x=>x.id===pid);const v=p&&p.variants.find(z=>z.id===vid);
  const qty=Math.max(1,parseInt($('#rs_qty').value)||0);
  if(!v)return $('#rsErr').textContent='Varian tidak ditemukan.';
  if(qty<1)return $('#rsErr').textContent='Qty minimal 1.';
  const cost=mParse($('#rs_cost').value);
  if(!needOnline())return;
  veil(true,'Menyimpan…');
  try{
    if(cost>0&&cost!==v.cost){const{error}=await sb.from('product_variants').update({cost}).eq('id',vid);if(error)throw error;v.cost=cost}
    const pno='BM-'+ymd(Date.now())+'-'+String(Date.now()).slice(-5);
    const{data:po,error:pe}=await sb.from('purchases').insert({no:pno,supplier:$('#rs_supplier').value.trim()||'Tanpa nota',by_name:PROFILE?.name||''}).select('id').single();
    if(pe)throw pe;
    const{error:le}=await sb.from('purchase_lines').insert({purchase_id:po.id,product_id:pid,variant_id:vid,kind:'restock',name:p.name+' · '+vLabel(v),qty,cost:v.cost||0});
    if(le)throw le;
    const{error:me}=await sb.from('moves').insert({product_id:pid,variant_id:vid,pname:p.name,vlabel:vLabel(v),type:'in',delta:qty,before:v.qty,after:v.qty+qty,ref:{kind:'purchase',id:po.id,no:pno},note:$('#rs_supplier').value.trim()||'Tanpa nota',by_name:PROFILE?.name||''});
    if(me)throw me;
    const{error:ue}=await sb.from('product_variants').update({qty:v.qty+qty}).eq('id',vid);
    if(ue)throw ue;
    v.qty+=qty;
    closeModal();loadPurchases().then(renderMasukT);
    toast('Stok +'+qty+' — '+p.name+' '+vLabel(v)+' ('+pno+')');
  }finally{veil(false)}
});
function returOpen(poId,ix){
  const po=db.purchases.find(x=>x.id===poId);const l=po.lines[ix];
  const p=db.products.find(x=>x.id===l.product_id);const v=p&&p.variants.find(z=>z.id===l.variant_id);
  const sisa=l.qty-(l.ret_qty||0);
  if(v&&v.qty<sisa)
    return toast(`Tidak bisa diretur: stok ${p.name} ${vLabel(v)} tinggal ${v.qty} (sudah terjual). Gunakan Stok & Opname.`,'err');
  window._ret={poId,ix};
  openModal(`${mhead('Retur Pembelian / Batal Beli')}
  <div class="mbody">
    <p style="color:var(--ink2);font-size:13px">Mengembalikan <b>${sisa} × ${esc(l.name||'')}</b> dari nota <b>${esc(po.no)}</b> ke supplier. Stok akan <b>dikurangi</b> dan tercatat di Kartu Stok.</p>
    <label class="fl">Alasan wajib *</label>
    <input class="inp" id="retReason" placeholder="mis. salah kirim, unit cacat, batal beli supplier">
    <div class="hint" id="retErr"></div>
  </div>
  <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn danger" onclick="returDo()">${ic('undo',15)} Retur & Kurangi Stok</button></div>`);
}
const returDo=guard(async function(){
  const {poId,ix}=window._ret;
  const po=db.purchases.find(x=>x.id===poId);const l=po.lines[ix];
  const p=db.products.find(x=>x.id===l.product_id);const v=p&&p.variants.find(z=>z.id===l.variant_id);
  const r=$('#retReason').value.trim();
  if(!r)return $('#retErr').textContent='Alasan wajib diisi.';
  const sisa=l.qty-(l.ret_qty||0);
  if(!needOnline())return;
  veil(true,'Menyimpan…');
  try{
    const{error}=await sb.from('purchase_lines').update({ret_qty:sisa,ret_note:r}).eq('purchase_id',poId)
      .eq('variant_id',l.variant_id);
    if(error)throw error;
    if(v){
      const{error:me}=await sb.from('moves').insert({product_id:p.id,variant_id:v.id,pname:p.name,vlabel:vLabel(v),
        type:'purchaseret',delta:-sisa,before:v.qty,after:Math.max(0,v.qty-sisa),ref:{kind:'purchase',id:poId,no:po.no},note:'Retur: '+r,by_name:PROFILE?.name||''});
      if(me)throw me;
      const{error:ue}=await sb.from('product_variants').update({qty:Math.max(0,v.qty-sisa)}).eq('id',v.id);
      if(ue)throw ue;
      v.qty=Math.max(0,v.qty-sisa);
      if(l.kind!=='restock'){await sb.from('product_variants').update({active:false}).eq('id',v.id);v.active=false}
    }
    l.ret_qty=sisa;l.ret_note=r;
    closeModal();renderMasukT();
    toast('Retur tercatat — stok −'+sisa);
  }finally{veil(false)}
});

const startOpname=guard(async function(cat){
  if(db.opnames.some(o=>o.status==='draft'))return toast('Masih ada draft opname yang belum selesai','err');
  if(!needOnline())return;
  veil(true,'Membuat sesi…');
  try{
    const prods=db.products.filter(p=>p.active&&(cat==='all'||p.cat===cat));
    const lines=prods.flatMap(p=>p.variants.filter(v=>v.active!==false).map(v=>({pname:p.name,vlabel:vLabel(v),imei:v.imei||'',cat:p.cat,sys:v.qty,fiz:v.qty,diff:0,pid:p.id,vid:v.id})));
    if(!lines.length)return toast('Tidak ada varian dalam cakupan ini','err');
    const{data:o,error:e1}=await sb.from('opnames').insert({cat,status:'draft',by_name:PROFILE?.name||'',note:''}).select('id').single();
    if(e1)throw e1;
    const rows=lines.map(l=>({opname_id:o.id,product_id:l.pid,variant_id:l.vid,pname:l.pname,vlabel:l.vlabel,cat:l.cat,imei:l.imei||null,sys:l.sys,fiz:l.fiz,diff:0}));
    for(let i=0;i<rows.length;i+=500){const{error}=await sb.from('opname_lines').insert(rows.slice(i,i+500));if(error)throw error}
    const linesOut=rows.map(l=>({pid:l.product_id,vid:l.variant_id,pname:l.pname,vlabel:l.vlabel,imei:l.imei||'',cat:l.cat,sys:l.sys,fiz:l.fiz,diff:0}));
    db.opnames.unshift({id:o.id,ts:Date.now(),cat,status:'draft',by:PROFILE?.name||'',note:'',appliedTs:null,appliedBy:'',lines:linesOut});
    closeModal();openOpnameEditor(o.id);
  }finally{veil(false)}
});
function opnBody(o){
  const rows=o.lines.map(l=>{
    const p=db.products.find(x=>x.id===l.pid);
    const v=p&&p.variants.find(z=>z.id===l.vid);
    const live=v?v.qty:0;
    const d=l.fiz-live;
    const unit=l.cat!=='aksesoris';
    return `<tr>
      <td><b style="font-size:12.5px">${esc(l.pname)}</b> · ${esc(l.vlabel||'Standar')}${l.imei?`<div class="pmeta">IMEI ${esc(l.imei)}</div>`:''}</td>
      <td><span class="bdg gray">${CAT[l.cat]}</span></td>
      <td class="num mono">${live}</td>
      <td>${!unit
        ?`<input class="inp num-inp" style="max-width:110px" value="${l.fiz}" oninput="opnSet('${l.pid}','${l.vid}',this.value)">`
        :`<select class="inp" style="max-width:140px" onchange="opnSet('${l.pid}','${l.vid}',this.value)">
            <option value="1" ${l.fiz===1?'selected':''}>Ada fisik</option>
            <option value="0" ${l.fiz===0?'selected':''}>Tidak ada</option></select>`}</td>
      <td id="od_${l.vid}">${diffBadge(d)}</td>
    </tr>`}).join('');
  return `
  <p style="color:var(--ink2);font-size:13px">Isi <b>hasil hitung fisik</b>. Penyesuaian dihitung terhadap <b>stok terkini</b> saat diterapkan.</p>
  <table class="tbl" style="min-width:0"><thead><tr><th>Produk · Varian</th><th>Kategori</th><th class="num">Stok Sistem</th><th>Hitung Fisik</th><th class="num">Selisih</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <label class="fl">Catatan opname</label>
  <input class="inp" id="opnNote" value="${esc(o.note||'')}" placeholder="mis. opname akhir bulan">`;
}
function diffBadge(d){return d===0?'<span class="bdg ok">cocok</span>':`<span class="bdg ${d>0?'blue':'bad'}">${d>0?'+':''}${d}</span>`}
function openOpnameEditor(id){
  const o=db.opnames.find(x=>x.id===id);
  S.opnId=id;
  openModal(`${mhead('Opname Stok — '+(o.cat==='all'?'Semua':CAT[o.cat]))}
  <div class="mbody" id="opnBodyWrap">${opnBody(o)}</div>
  <div class="mfoot" style="flex-wrap:wrap">
    <button class="btn ghost" style="margin-right:auto" onclick="closeModal()">Tutup (tersimpan sebagai draft)</button>
    <button class="btn ghost" onclick="opnReset()">Samakan dengan Sistem</button>
    ${canOwner()
      ?`<button class="btn" onclick="applyOpname('${id}')">${ic('check',15)} Terapkan Penyesuaian</button>`
      :`<button class="btn" disabled title="Hanya Owner">Menunggu Approval Owner</button>`}
  </div>`,'wide');
}
const opnSet=guard(async function(pid,vid,val){
  const o=db.opnames.find(x=>x.id===S.opnId);if(!o)return;
  const l=o.lines.find(z=>z.pid===pid&&z.vid===vid);if(!l)return;
  l.fiz=Math.max(0,parseInt(val)||0);
  const p=db.products.find(x=>x.id===pid);const v=p&&p.variants.find(z=>z.id===vid);
  $('#od_'+vid).innerHTML=diffBadge(l.fiz-(v?v.qty:0));
  await sb.from('opname_lines').update({fiz:l.fiz}).eq('opname_id',o.id).eq('variant_id',vid);
});
const opnReset=guard(async function(){
  const o=db.opnames.find(x=>x.id===S.opnId);if(!o)return;
  for(const l of o.lines){
    const p=db.products.find(x=>x.id===l.pid);const v=p&&p.variants.find(z=>z.id===l.vid);
    l.fiz=v?v.qty:0;
    await sb.from('opname_lines').update({fiz:l.fiz}).eq('opname_id',o.id).eq('variant_id',l.vid);
  }
  openOpnameEditor(S.opnId);
});
const applyOpname=guard(async function(id){
  if(!canOwner())return toast('Hanya Owner yang bisa menerapkan penyesuaian opname','err');
  const o=db.opnames.find(x=>x.id===id);
  o.note=$('#opnNote')?$('#opnNote').value.trim():o.note;
  if(!needOnline())return;
  veil(true,'Menerapkan penyesuaian…');
  try{
    let n=0,inp=0,out=0;
    for(const l of o.lines){
      const p=db.products.find(x=>x.id===l.pid);const v=p&&p.variants.find(z=>z.id===l.vid);if(!v)continue;
      const live=v.qty;
      const d=l.fiz-live;
      l.diff=d;
      if(d!==0){
        await sb.from('product_variants').update({qty:l.fiz}).eq('id',v.id);
        await sb.from('moves').insert({product_id:p.id,variant_id:v.id,pname:p.name,vlabel:vLabel(v),
          type:'opname',delta:d,before:live,after:l.fiz,ref:{kind:'opname',id},note:'Opname: fisik '+l.fiz+' · sistem '+live,by_name:PROFILE?.name||''});
        v.qty=l.fiz;n++;d>0?inp+=d:out+=-d;
      }
    }
    await sb.from('opname_lines').update({diff:0}).eq('opname_id',id); // aman: diff di-refresh
    for(const l of o.lines){if(l.diff)await sb.from('opname_lines').update({diff:l.diff}).eq('opname_id',id).eq('variant_id',l.vid)}
    await sb.from('opnames').update({status:'applied',applied_at:new Date().toISOString(),applied_by:PROFILE?.name||'',note:o.note}).eq('id',id);
    o.status='applied';o.appliedTs=Date.now();o.appliedBy=PROFILE?.name||'';
    S.opnId=null;closeModal();viewOpname();
    toast(n?('Opname diterapkan: '+n+' varian (+'+inp+' / −'+out+') — tercatat di Kartu Stok'):'Tidak ada selisih — stok sudah cocok');
  }finally{veil(false)}
});

const vSortKey=v=>(STORAGE_ORDER[v.storage]??9)+'|'+String(v.color||'').toLowerCase();
let hppVals={};
function viewHPP(){
  if(!canOwner())return go('master','');
  setTitle('Isi HPP Massal');
  hppVals={};
  db.products.forEach(p=>p.variants.forEach(v=>{hppVals[p.id+'|'+v.id]=v.cost!=null&&v.cost?String(v.cost):''}));
  S.hppQ='';
  $('#view').innerHTML=`
  <p class="lead">Isi cepat: masukkan persentase dari harga jual (cth: 90 = HPP 90% dari harga jual), lalu terapkan. Setiap baris = <b>seri + warna + storage</b>.</p>
  <div class="card">
    <label class="fl" style="margin-top:0;font-size:13.5px">HPP = berapa % dari harga jual?</label>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input class="inp" id="hppPct" placeholder="cth: 90" style="max-width:220px" oninput="S.hppPct=this.value">
      <button class="btn ghost" onclick="hppApply(false)">Terapkan ke Semua</button>
      <button class="btn ghost" onclick="hppApply(true)">Hanya yang Kosong</button>
      <span style="flex:1"></span>
      <div class="srch" style="position:relative;min-width:210px">${ic('search',16)}<input class="inp" style="padding-left:36px" placeholder="Cari produk…" oninput="S.hppQ=this.value;renderHPPT()"></div>
    </div>
    <div style="margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:6px 18px;max-height:520px;overflow:auto">
      <div class="hpprow" style="border-bottom:1px solid var(--line);padding:10px 0">
        <b style="font-size:11px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase">Produk (Seri · Warna · Storage)</b>
        <b style="font-size:11px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase;text-align:right">Harga Jual</b>
        <b style="font-size:11px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase">HPP (Modal)</b>
      </div>
      <div id="hppTable"></div>
    </div>
    <button class="btn lg blk" style="margin-top:18px" onclick="hppSave()">${ic('check',16)} Simpan Semua HPP</button>
    <button class="btn lg ghost" style="margin-top:10px" onclick="go('master','')">Batal</button>
  </div>`;
  renderHPPT();
}
function hppFullLabel(p,v){return (v.storage||v.color)?`${p.name} ${vLabel(v)}`:p.name}
function renderHPPT(){
  const q=(S.hppQ||'').toLowerCase();
  const rows=[];
  db.products.filter(p=>p.active!==false)
    .filter(p=>!q||p.name.toLowerCase().includes(q)||p.variants.some(v=>((v.storage||'')+' '+(v.color||'')).toLowerCase().includes(q)))
    .slice().sort((a,b)=>a.name.localeCompare(b.name,'id'))
    .forEach(p=>{p.variants.filter(v=>v.active!==false).slice().sort((a,b)=>vSortKey(a)-vSortKey(b)).forEach(v=>rows.push({p,v,key:p.id+'|'+v.id}))});
  $('#hppTable').innerHTML=rows.length?rows.map(r=>`
    <div class="hpprow">
      <div style="display:flex;gap:10px;align-items:center;min-width:0">
        <div class="pthumb" style="width:34px;height:34px"><img src="${prodImg(r.p)}" alt=""></div>
        <span style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(hppFullLabel(r.p,r.v))}</span>
      </div>
      <div class="num" style="font-variant-numeric:tabular-nums;font-weight:700">${fmtN(r.v.price)}</div>
      <input class="inp num-inp" data-money value="${hppVals[r.key]?mFmt(hppVals[r.key]):''}" placeholder="0"
        oninput="hppVals['${r.key}']=String(mParse(this.value))">
    </div>`).join(''):'<div class="empty">Tidak ada produk yang cocok.</div>';
}
function hppApply(onlyEmpty){
  const pct=parseFloat((S.hppPct||$('#hppPct').value).replace(',','.'));
  if(!pct||pct<=0)return toast('Isi dulu persentasenya, mis. 90','err');
  let n=0;
  db.products.forEach(p=>p.variants.forEach(v=>{
    const key=p.id+'|'+v.id;
    if(onlyEmpty&&hppVals[key])return;
    hppVals[key]=String(Math.round(v.price*pct/100));n++;
  }));
  renderHPPT();
  toast(`${n} varian diisi HPP ${pct}% — cek lalu Simpan`);
}
const hppSave=guard(async function(){
  if(!needOnline())return;
  const rows=[];
  db.products.forEach(p=>p.variants.forEach(v=>{
    const v2=mParse(hppVals[p.id+'|'+v.id]);
    if(v2>0&&v2!==v.cost){rows.push({variant_id:v.id,cost:v2});v.cost=v2}
  }));
  if(!rows.length)return toast('Tidak ada perubahan HPP');
  const{data,error}=await sb.rpc('bulk_update_hpp',{rows});
  if(error)throw error;
  toast(rows.length+' HPP varian berhasil disimpan');
  go('master','');
});

async function viewConsign(){

    const{data,error}=await sb.from('transaction_items')
      .select('tx_id,consignment,name,vlabel,qty,price,transactions(no,created_at,buyer,status)')
      .not('consignment','is',null).limit(500);

    const items=(data||[]).filter(x=>x.transactions&&x.transactions.status!=='void')
      .map(x=>({tx:{no:x.transactions.no,ts:new Date(x.transactions.created_at).getTime(),buyer:x.transactions.buyer},
        it:{name:x.name,vlabel:x.vlabel||'',price:+x.price,qty:x.qty,consign:x.consignment}}));

      <div><div class="klab">Harus Disetor ke Penitip</div><div class="kval" style="color:${unset.length?'var(--bad)':'var(--ok)'}">${fmt(unset.reduce((a,x)=>a+consignAmt(x.it),0))}</div><div class="knote">${unset.length} unit terjual belum disetor</div></div>
      ${Object.entries(byOwner).map(([o,v])=>`<div><div class="klab">Kepada ${esc(o)}</div><div class="kval">${fmt(v)}</div><div class="knote">bagian penitip</div></div>`).join('')}
    </div>
    <div class="twrap"><table class="tbl"><thead><tr><th>Barang</th><th>Penitip</th><th class="num">Harga Jual</th><th class="num">Bagian Penitip</th><th>Status</th><th></th></tr></thead>
    <tbody>${items.length?items.map((x,i)=>`<tr>
      <td><b style="font-size:13px">${esc(x.it.name)}</b>${x.it.vlabel&&x.it.vlabel!=='Standar'?' · '+esc(x.it.vlabel):''}<div class="pmeta">${esc(x.tx.no)} · ${dFull(x.tx.ts)}</div></td>
      <td>${esc(x.it.consign.owner)}</td><td class="num mono">${fmt(x.it.price*x.it.qty)}</td>
      <td class="num mono">${fmt(consignAmt(x.it))}</td>
      <td>${x.it.consign.settled?'<span class="bdg ok">Sudah disetor</span>':'<span class="bdg warn">Belum disetor</span>'}</td>
      <td>${!x.it.consign.settled?`<button class="btn soft sm" onclick="settleConsign('${x.tx.no}','${esc(x.it.name)}',${x.it.price})">${ic('check',13)} Tandai disetor</button>`:''}</td>
    </tr>`).join(''):'<tr><td colspan="6"><div class="empty">Belum ada penjualan barang konsinyasi.</div></td></tr>'}</tbody></table></div>
    <div class="card" style="margin-top:18px"><h4>${ic('package',15)} Unit Titipan Masih di Stok</h4>
      ${avail.length?avail.map(x=>`<div class="mrow"><span><b>${esc(x.p.name)} · ${esc(vLabel(x.v))}</b> · ${esc(x.v.consignment.pct)}% penitip</span><span>${fmt(x.v.price)} · bagi penitip ${fmt(x.v.cost??Math.round(x.v.price*x.v.consignment.pct/100))}</span></div>`).join(''):'<div class="empty">Tidak ada unit titipan tersisa.</div>'}
    </div>`;

const settleConsign=guard(async function(no,name,price){
  if(!needOnline())return;
  const{data:tx,error:e1}=await sb.from('transactions').select('id').eq('no',no).single();
  if(e1)throw e1;
  const{data:items,error:e2}=await sb.from('transaction_items').select('id,consignment').eq('tx_id',tx.id).eq('name',name).eq('price',price);
  if(e2)throw e2;
  const it=(items||[]).find(x=>x.consignment&&!x.consignment.settled);
  if(!it)return toast('Tidak ditemukan / sudah disetor','err');
  const c={...it.consignment,settled:true};
  const{error:e3}=await sb.from('transaction_items').update({consignment:c}).eq('id',it.id);
  if(e3)throw e3;
  toast('Setoran ke penitip dicatat — '+fmt(c.amt??0));
  viewConsign();
});

function renderHistT(){
  const own=canOwner(),r=S.rq;
  const q=(S.q.hist||'').toLowerCase();
  const list=db.transactions
    .filter(t=>r.st==='all'||t.status===r.st)
    .filter(t=>!q||(t.no+' '+(t.buyer||'')).toLowerCase().includes(q));
  $('#hT').innerHTML=list.length?list.map(t=>{
    const st=t.status==='lunas'?'<span class="bdg ok">LUNAS</span>':'<span class="bdg bad">VOID / RETUR</span>';
    const pr=own?((t.total||0)-((t._hpp||0))-((t._fee||0))):0;
    return `<tr ${t.status==='void'?'style="opacity:.55"':''}>
      <td><b>${t.no}</b>${t.offlineFlag?' <span class="bdg blue">offline</span>':''}</td>
      <td style="white-space:nowrap">${dtFull(t.ts)}</td>
      <td>${esc(t.cashier||'')}</td>
      <td class="num mono">${fmt(t.total)}</td>
      <td>${st}</td>

const doVoid=guard(async function(tid){
  const r=$('#voidReason').value.trim();

  if(!needOnline())return;
  veil(true,'Membatalkan…');
  try{

    if(error)throw error;
    const t=db.transactions.find(x=>x.id===tid);
    if(t){t.status='void';t.voidInfo={reason:r,conflict:data&&data.conflict}}

function periodRange(){
  const now=Date.now(),p=S.per;
  if(p.k==='today')return[startDay(now),endDay(now),'Hari ini'];
  if(p.k==='7')return[startDay(now-6*864e5),endDay(now),'7 hari terakhir'];
  if(p.k==='30')return[startDay(now-29*864e5),endDay(now),'30 hari terakhir'];
  if(p.k==='month'){const d=new Date();return[new Date(d.getFullYear(),d.getMonth(),1).getTime(),endDay(now),'Bulan ini']}
  return[startDay(p.from||now),endDay(p.to||now),'Periode kustom'];
}
function setPeriod(k){
  if(k==='custom'){S.per={k,from:new Date($('#pFrom').value||Date.now()-29*864e5).getTime(),to:new Date($('#pTo').value||Date.now()).getTime()}}
  else S.per={k};
  viewPnL();
}

  setTitle('Laba Rugi');

          <tr><td style="padding:6px 0;color:var(--ink2)">HPP / modal barang terjual</td><td class="num mono" style="color:var(--bad)">(${fmt(a.hpp)})</td></tr>
          <tr><td style="padding:10px 0;font-weight:800;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">LABA KOTOR</td><td class="num mono" style="font-weight:800;font-size:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">${fmt(a.gross)}</td></tr>
          <tr><td style="padding:6px 0;color:var(--ink2)">Biaya admin metode bayar (fee EDC/QRIS/Paylater)</td><td class="num mono" style="color:var(--bad)">(${fmt(a.fee)})</td></tr>

          ${exps.length?exps.map(e=>`<tr><td style="padding:2px 0 2px 14px;color:var(--mut);font-size:12.5px">└ ${esc(e.cat)} — ${esc(e.note)}</td><td class="num" style="color:var(--mut);font-size:12.5px">${fmt(e.amt)}</td></tr>`).join(''):''}
          <tr><td style="padding:12px 0 2px;font-weight:800;border-top:2px solid var(--ink);font-size:15px">LABA BERSIH</td>
          <td class="num mono" style="font-weight:800;font-size:20px;border-top:2px solid var(--ink);padding-top:10px;color:${a.net>=0?'var(--ink)':'var(--bad)'}">${fmt(a.net)}</td></tr>
        </table></div>
      <div>
        <div class="card"><h4>${ic('up',15)} Laba per Kategori Produk</h4>

          <div class="mrow"><span>Margin laba bersih</span><b>${a.rev?(a.net/a.rev*100).toFixed(1):'0'}%</b></div>
          <div class="mrow"><span>Rata-rata per transaksi</span><b>${fmt(a.cnt?a.rev/a.cnt:0)}</b></div>

  }catch(e){$('#pnlBody').innerHTML=`<div class="err">Gagal menghitung: ${esc(e.message||e)}</div>`}
}
function exportCSV(){
  const P=window._pnlA;if(!P)return;
  const a=P.a;
  const rows=[['Laporan Laba Rugi','Period: '+P.label],[],
    ['Penjualan bersih',a.rev],['HPP / modal',a.hpp],['Laba kotor',a.gross],
    ['Biaya admin metode bayar',a.fee],['Biaya operasional',a.exp],['LABA BERSIH',a.net],[]];
  Object.entries(a.byCat).forEach(([c,b])=>rows.push([CAT[c]+' - omzet',b.rev,'HPP',b.hpp,'Laba',b.rev-b.hpp]));
  const csv='\ufeff'+rows.map(r=>r.join(';')).join('\n');
  const bl=new Blob([csv],{type:'text/csv'});const el=document.createElement('a');
  el.href=URL.createObjectURL(bl);el.download='laba-rugi-'+P.label.replace(/ /g,'-')+'.csv';el.click();
  toast('Laporan diexport — siap dibuka di Excel');
}

    <td>${m.feeType==='none'?'<span class="bdg gray">Tanpa fee</span>':`<span class="bdg blue">${m.feeValue}${m.feeType==='percent'?'%':' Rp'} per transaksi</span>`}</td>
    <td><span class="bdg ${m.active?'ok':'gray'}">${m.active?'Aktif':'Nonaktif'}</span></td>
    <td style="white-space:nowrap"><button class="btn ghost sm" onclick="openMtd('${m.id}')">${ic('edit',13)}</button>
    <button class="btn ghost sm" style="color:${m.active?'var(--bad)':'var(--ok)'}" onclick="toggleMtd('${m.id}')">${m.active?'Nonaktifkan':'Aktifkan'}</button></td>
  </tr>`).join('')}</tbody></table></div>`;
}
function openMtd(id){
  const m=id?db.paymentMethods.find(x=>x.id===id):null;
  openModal(`${mhead(m?'Edit Metode':'Metode Bayar Baru')}
  <div class="mbody">
    <label class="fl" style="margin-top:0">Nama metode *</label><input class="inp" id="mName" value="${esc(m?.name||'')}" placeholder="mis. Kredivo, Home Credit">
    <label class="fl">Jenis</label>
    <select class="inp" id="mKind">${Object.entries(MTD_TYPE).map(([k,v])=>`<option value="${k}" ${m?.type===k?'selected':''}>${v}</option>`).join('')}</select>
    <label class="fl">Biaya admin</label>
    <div class="grid2"><select class="inp" id="mType"><option value="none" ${m?.feeType==='none'?'selected':''}>Tanpa fee</option><option value="percent" ${m?.feeType==='percent'?'selected':''}>Persen (%)</option><option value="fixed" ${m?.feeType==='fixed'?'selected':''}>Nominal (Rp)</option></select>
    <input class="inp" id="mVal" value="${m&&m.feeType!=='none'?m.feeValue:''}" placeholder="mis. 4.5"></div>
  </div>
  <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="saveMtd('${id||''}')">Simpan</button></div>`);
}
const saveMtd=guard(async function(id){
  const name=$('#mName').value.trim();if(!name)return toast('Nama wajib diisi','err');
  const t=$('#mType').value,k=$('#mKind').value,v=parseFloat($('#mVal').value)||0;
  if(!needOnline())return;
  if(id){
    const{error}=await sb.from('payment_methods').update({name,type:k,fee_type:t,fee_value:v}).eq('id',id);
    if(error)throw error;
    Object.assign(db.paymentMethods.find(x=>x.id===id),{name,type:k,feeType:t,feeValue:v});
  }else{
    const{data,error}=await sb.from('payment_methods').insert({name,type:k,fee_type:t,fee_value:v}).select('id,name,type,fee_type,fee_value,active').single();
    if(error)throw error;
    db.paymentMethods.push({id:data.id,name:data.name,type:data.type,feeType:data.fee_type,feeValue:+data.fee_value,active:data.active});
  }
  closeModal();viewMethods();toast('Metode bayar tersimpan');
});
const toggleMtd=guard(async function(id){
  const m=db.paymentMethods.find(x=>x.id===id);
  const{error}=await sb.from('payment_methods').update({active:!m.active}).eq('id',id);
  if(error)throw error;
  m.active=!m.active;viewMethods();
});

/* =====================================================================
   PRINTER & CETAK
===================================================================== */
let scanRes=null;
function viewPrinter(){
  setTitle('Cetak / Printer');
  $('#view').innerHTML=`
  <p class="lead">Deteksi printer thermal USB & Bluetooth, pilih default per perangkat, dan uji cetak. Tanpa printer? Struk tetap bisa dikirim sebagai PDF/gambar.</p>
  <div class="dgrid2" style="margin-top:0">
    <div class="card"><h4>${ic('printer',15)} Cari Printer</h4>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn" id="scanBtn" onclick="scanPrinters()">${ic('refresh',15)} Cari Printer (USB / Bluetooth)</button>
        <div class="chips"><div class="chip ${db.settings.paper==='58'?'on':''}" onclick="db.settings.paper='58';saveDev({paper:'58'});viewPrinter()">58 mm</div><div class="chip ${db.settings.paper==='80'?'on':''}" onclick="db.settings.paper='80';saveDev({paper:'80'});viewPrinter()">80 mm</div></div>
      </div>
      <div id="scanRes" style="margin-top:14px"></div>
      <!-- Implementasi nyata: WebUSB / Web Bluetooth API (Chrome/Edge desktop & Android)
           untuk perangkat ESC/POS. Safari/iOS: fallback AirPrint / simpan PDF. -->
    </div>
    <div class="card"><h4>${ic('file',15)} Uji & Fallback</h4>
      <p style="color:var(--ink2);font-size:13px">Printer default saat ini:<br><b style="font-size:15px">${db.settings.printer?esc(db.settings.printer.name):'Belum dipilih — struk dicetak ke PDF'}</b></p>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn ghost" onclick="testPrint()">${ic('file',15)} Test Print (PDF)</button>
        <button class="btn ghost" onclick="go('pos','')">${ic('cart',15)} Kembali ke Kasir</button>
      </div>
      <p style="font-size:12px;color:var(--mut);margin-top:14px">Cetakan thermal via koneksi lokal (USB/Bluetooth) tidak bergantung internet — struk tetap tercetak saat mode offline.</p>
    </div>
  </div>`;
  renderScan();
}
function scanPrinters(){
  $('#scanBtn').disabled=true;$('#scanBtn').innerHTML='<span class="spin"></span> Memindai…';
  setTimeout(()=>{
    scanRes=[{id:'pr1',name:'EPSON TM-T82III',conn:'USB'},{id:'pr2',name:'Rongta RP326',conn:'Bluetooth'},{id:'pr3',name:'Xprinter XP-58B',conn:'Bluetooth'},{id:'pr4',name:'Print ke PDF (sistem)',conn:'Virtual'}];
    $('#scanBtn').disabled=false;$('#scanBtn').innerHTML=ic('refresh',15)+' Cari Ulang';
    renderScan();toast('4 printer terdeteksi — pilih yang aktif dipakai');
  },1100);
}
function renderScan(){
  if(!scanRes){$('#scanRes').innerHTML='<div class="empty">Belum ada pemindaian. Klik "Cari Printer" untuk mendeteksi perangkat terpasang.</div>';return}
  $('#scanRes').innerHTML=scanRes.map(p=>`<div class="mrow"><span>${ic('printer',15)} <b>${esc(p.name)}</b> <span class="bdg ${p.conn==='USB'?'blue':p.conn==='Bluetooth'?'sun':'gray'}" style="margin-left:6px">${p.conn}</span></span>
    <span style="display:flex;gap:8px;align-items:center">${db.settings.printer?.id===p.id?'<span class="bdg ok">Default</span>':`<button class="btn soft sm" onclick="pickPrinter('${p.id}')">Jadikan default</button>`}</span></div>`).join('');
}
function pickPrinter(id){db.settings.printer=scanRes.find(p=>p.id===id);saveDev({printer:db.settings.printer});renderScan();toast('Printer default: '+db.settings.printer.name)}
async function testPrint(){
  const{data:t}=await sb.from('transactions').select('id,no,created_at,cashier_name,buyer,subtotal,discount,discount_amt,trade_total,total,status').neq('status','void').order('created_at',{ascending:false}).limit(1);
  let tx;
  if(t&&t.length)tx=await loadTxDetail(t[0].id);
  tx=tx||{no:'TEST-PRINT',ts:Date.now(),cashier:S.user.email,buyer:'',items:[{name:'Test print struk',vlabel:'128GB',qty:1,price:0,imei:'',warranty:0}],tradeIns:[],disc:null,subtotal:0,discAmt:0,tradeTotal:0,total:0,payments:[{name:'-',amt:0,fee:0}]};
  doPrint(receiptHTML(tx,db.settings.paper));
}

/* =====================================================================
   PENGATURAN
===================================================================== */
async function viewSettings(){
  setTitle('Pengaturan');
  $('#view').innerHTML=`<div class="empty">${ic('refresh',18)} Memuat…</div>`;
  let users=[];
  try{
    const{data,error}=await sb.from('profiles').select('id,name,role,active').order('role');
    if(error)throw error;
    users=data||[];
  }catch(e){users=[]}
  db.users=users;
  $('#view').innerHTML=`
  <div class="dgrid2" style="margin-top:0">
    <div class="card"><h4>${ic('smartphone',15)} Info Toko (dipakai di struk — tersinkron semua perangkat)</h4>
      <label class="fl" style="margin-top:0">Nama toko</label><input class="inp" id="sName" value="${esc(db.settings.shopName)}">
      <label class="fl">Alamat</label><input class="inp" id="sAddr" value="${esc(db.settings.addr||'')}">
      <label class="fl">Telepon / WhatsApp</label><input class="inp" id="sTelp" value="${esc(db.settings.telp||'')}">
      <button class="btn" style="margin-top:16px" onclick="saveShop()">${ic('check',15)} Simpan</button>
    </div>
    <div class="card"><h4>${ic('users',15)} User & Role</h4>
      <p style="color:var(--ink2);font-size:13px">Menambah user baru dilakukan lewat <b>Supabase Dashboard → Authentication → Users</b> (demi keamanan, hanya dari sana). Di sini Owner bisa mengubah role & menonaktifkan.</p>
      ${users.map(u=>`<div class="mrow"><span><b>${esc(u.name)}</b><div class="pmeta">${u.id===S.user.id?'(Anda)':''}</div></span>
        <span style="display:flex;gap:6px;align-items:center">
          ${canOwner()?`<select class="inp" style="width:110px;padding:5px" onchange="setUserRole('${u.id}',this.value)">
            <option value="kasir" ${u.role==='kasir'?'selected':''}>Kasir</option>
            <option value="gudang" ${u.role==='gudang'?'selected':''}>Gudang</option>
            <option value="owner" ${u.role==='owner'?'selected':''}>Owner</option></select>`:`<span class="bdg gray">${u.role}</span>`}
          <span class="bdg ${u.active?'ok':'bad'}">${u.active?'Aktif':'Nonaktif'}</span>
          ${canOwner()&&u.id!==S.user.id?`<button class="btn ghost sm" onclick="toggleUserActive('${u.id}')">${u.active?'Off':'On'}</button>`:''}
        </span></div>`).join('')||'<div class="empty">Tidak dapat memuat user.</div>'}
    </div>
  </div>
  <div class="dgrid2">
    <div class="card"><h4>${ic('hist',15)} Koneksi & Realtime</h4>
      <div class="mrow"><span>Server</span><b>${esc(ENV.url?ENV.url.replace('https://','').split('.')[0]:'—')}</b></div>
      <div class="mrow"><span>Status</span><span class="bdg ${navigator.onLine?'ok':'bad'}">${navigator.onLine?'ONLINE':'OFFLINE'}</span></div>
      <div class="mrow"><span>Antrean offline</span><b>${outbox().length} transaksi</b></div>
      <button class="btn ghost sm" style="margin-top:10px" onclick="manualSync()">${ic('refresh',14)} Sinkron sekarang</button>
    </div>
    <div class="card"><h4>${ic('down',15)} Backup & Data</h4>
      <p style="color:var(--ink2);font-size:13px">Data utama tersimpan aman di Supabase (backup otomatis platform). Unduh snapshot tampilan bila perlu.</p>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        <button class="btn ghost" onclick="downloadBackup()">${ic('down',15)} Unduh Snapshot JSON</button>
        <button class="btn ghost" onclick="refreshAll()">${ic('refresh',15)} Muat Ulang Semua Data</button>
      </div>
    </div>
  </div>`;
}
const saveShop=guard(async function(){
  const n=$('#sName').value.trim()||'FENCELL',a=$('#sAddr').value.trim(),t=$('#sTelp').value.trim();
  await saveSettings(n,a,t);
  toast('Info toko tersimpan — dipakai di struk semua perangkat');
});
const setUserRole=guard(async function(id,role){
  if(!needOnline())return;
  const{error}=await sb.from('profiles').update({role}).eq('id',id);
  if(error)throw error;
  const u=db.users.find(x=>x.id===id);if(u)u.role=role;
  toast('Role diubah menjadi '+role);
});
const toggleUserActive=guard(async function(id){
  const u=db.users.find(x=>x.id===id);if(!u)return;
  const{error}=await sb.from('profiles').update({active:!u.active}).eq('id',id);
  if(error)throw error;
  u.active=!u.active;viewSettings();
  toast('User '+(u.active?'diaktifkan':'dinonaktifkan'));
});
async function refreshAll(){veil(true,'Memuat ulang…');try{await bootData();_dashCache=null;route();toast('Semua data dimuat ulang')}catch(e){toast('Gagal: '+(e.message||e),'err')}finally{veil(false)}}
function downloadBackup(){
  const bl=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),settings:db.settings,products:db.products,paymentMethods:db.paymentMethods,expenses:db.expenses,capital:db.capital},null,2)],{type:'application/json'});
  const el=document.createElement('a');el.href=URL.createObjectURL(bl);el.download='backup-fencell-'+ymd(Date.now())+'.json';el.click();
  toast('Snapshot JSON diunduh');
}

/* ---------------- Init ---------------- */
(async function init(){
  if(!window.supabase){renderLogin();$('#lgErr')&&0;return}
  if(!createSb()){renderLogin();
    const err=document.createElement('div');err.className='err';err.textContent='Koneksi Supabase belum diatur — buka "Pengaturan koneksi" di bawah.';
    document.querySelector('.lg-card').insertBefore(err,document.querySelector('.demo'));
    return}
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){
      const{data:prof,error}={value:null};
      const r=await sb.from('profiles').select('id,name,role,active').eq('id',session.user.id).single();
      if(!r.error&&r.data&&r.data.active){
        PROFILE=r.data;
        S.user={id:r.data.id,email:session.user.email,role:r.data.role};
        veil(true,'Memuat data toko…');
        await bootData();
        veil(false);
        S.view=DEFAULT_VIEW[S.user.role];S.sub='';
        renderApp();return;
      }
    }
  }catch(e){console.warn(e)}
  renderLogin();
})();
</script>
